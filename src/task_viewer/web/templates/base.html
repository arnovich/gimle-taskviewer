<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}tv{% endblock %} — tv</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f3;
    --surface: #ffffff;
    --line: #d5dad6;
    --line-strong: #aeb6b1;
    --fg: #1d2226;
    --muted: #626d76;
    --link: #2a6a99;
    --amber: #9a6600;
    --amber-bg: #fbf1d6;
    --green: #1f7a4c;
    --green-bg: #e3f3ea;
    --danger: #b3261e;
    --sans: "Adwaita Sans", "Inter", "Noto Sans", system-ui, sans-serif;
    --mono: "JetBrainsMono Nerd Font", "JetBrains Mono", "Adwaita Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15191e;
      --surface: #1c2128;
      --line: #2b333c;
      --line-strong: #46515c;
      --fg: #e2e7eb;
      --muted: #8c97a3;
      --link: #86b3d8;
      --amber: #e6b450;
      --amber-bg: #2c2412;
      --green: #62c28e;
      --green-bg: #15261d;
      --danger: #f08a82;
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font: 15px/1.5 var(--sans);
    color: var(--fg);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 3px; }
  code, .mono { font-family: var(--mono); font-size: .88em; }
  code { color: var(--fg); }

  /* Chrome */
  header.top {
    display: flex; align-items: center; gap: 1rem;
    padding: .55rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  header.top .brand { font-weight: 650; color: var(--fg); letter-spacing: -.01em; }
  header.top .brand:hover { text-decoration: none; }
  header.top .crumbs { color: var(--muted); }
  header.top .crumbs a { color: var(--muted); }
  header.top form { margin-left: auto; }
  main { max-width: 68rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  h1 { font-size: 1.55rem; line-height: 1.2; font-weight: 650; letter-spacing: -.015em; margin: 0 0 .35rem; }
  h2 { font-size: 1rem; font-weight: 650; margin: 2.2rem 0 .6rem; display: flex; align-items: baseline; gap: .5rem; }
  h2 .count { font-weight: 500; color: var(--muted); }
  h2:first-of-type { margin-top: .5rem; }
  .muted { color: var(--muted); }
  .warn { color: var(--amber); }
  .bad { color: var(--danger); }
  .lede { color: var(--muted); margin: 0 0 1.25rem; }
  .empty { color: var(--muted); margin: .25rem 0 0; }

  /* The one bold thing: how many turns are yours. */
  .hero { display: flex; align-items: baseline; gap: .8rem; margin: .25rem 0 .75rem; }
  .hero .number { font-size: 3.4rem; line-height: 1; font-weight: 650; letter-spacing: -.03em; color: var(--amber); }
  .hero .number.zero { color: var(--muted); }
  .hero .caption { color: var(--muted); font-size: 1.05rem; }

  /* Tables: rules between rows, nothing else. */
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-weight: 500; font-size: .82rem; color: var(--muted); padding: 0 .6rem .35rem 0; border-bottom: 1px solid var(--line-strong); }
  td { padding: .45rem .6rem .45rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: color-mix(in srgb, var(--surface) 60%, var(--bg)); }
  td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.dim { color: var(--muted); }
  td.id { font-family: var(--mono); font-size: .85rem; color: var(--muted); white-space: nowrap; }
  td.state { width: 1.2rem; color: var(--muted); padding-right: .3rem; }

  .rank {
    display: inline-block; min-width: 1.6em; padding: 0 .35em; text-align: center;
    font-family: var(--mono); font-size: .8rem; line-height: 1.5;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px;
  }
  .tag { display: inline-block; padding: 0 .45em; border-radius: 4px; font-size: .8rem; line-height: 1.55; color: var(--muted); border: 1px solid var(--line); }
  .ask { display: inline-block; min-width: 1.35em; text-align: center; border-radius: 4px; font-weight: 650; font-size: .82rem; line-height: 1.55; color: var(--amber); background: var(--amber-bg); }

  /* Buttons and form controls */
  button, .btn {
    font: inherit; font-size: .92rem; font-weight: 500; line-height: 1.3;
    padding: .38rem .85rem; border-radius: 6px; cursor: pointer;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line-strong);
  }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { cursor: default; color: var(--muted); border-color: var(--line); background: transparent; }
  button.primary { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  button.primary:hover:not(:disabled) { opacity: .9; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: .9rem 0 1.4rem; }
  .actions form { display: contents; }
  textarea {
    width: 100%; min-height: 7.5rem; padding: .6rem .75rem;
    font: inherit; color: var(--fg); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: 6px; resize: vertical;
  }
  textarea::placeholder { color: var(--muted); }

  /* The kind of entry, as a segmented control. */
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .seg label { position: relative; padding: .3rem .8rem; font-size: .9rem; cursor: pointer; color: var(--muted); border-right: 1px solid var(--line-strong); }
  .seg label:last-child { border-right: 0; }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { color: var(--bg); background: var(--fg); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--fg); outline-offset: -2px; }
  .reply { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line); }
  .reply .row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .6rem; }
  .reply .row .as { color: var(--muted); }
  .reply .send { display: flex; align-items: center; gap: .75rem; margin-top: .6rem; }

  /* Task page */
  .meta { display: flex; flex-wrap: wrap; gap: .35rem .9rem; color: var(--muted); margin: 0 0 .5rem; align-items: center; }
  .meta .tags { display: inline-flex; gap: .3rem; }
  .banner {
    display: flex; gap: .6rem; align-items: baseline;
    margin: 1rem 0; padding: .6rem .9rem; border-radius: 6px;
    background: var(--amber-bg); color: var(--fg); border-left: 3px solid var(--amber);
  }
  .banner strong { color: var(--amber); }
  .body { max-width: 72ch; }
  .body > :first-child { margin-top: 0; }
  .body h1 { font-size: 1.25rem; margin-top: 1.5rem; }
  .body h2 { font-size: 1.05rem; margin: 1.6rem 0 .4rem; display: block; }
  .body h3 { font-size: 1rem; margin: 1.2rem 0 .3rem; }
  .body pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .7rem .9rem; overflow: auto; font-size: .85rem; }
  .body :not(pre) > code { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 0 .3em; }
  .body table { width: auto; }
  .body th, .body td { padding: .25rem .7rem .25rem 0; }
  .body blockquote { margin: .8rem 0; padding-left: .9rem; border-left: 3px solid var(--line-strong); color: var(--muted); }
  .body img { max-width: 100%; }

  /* The thread: a ledger with a rail per entry, coloured by kind. */
  .thread { max-width: 72ch; }
  .entry { position: relative; padding: .1rem 0 .1rem 1rem; margin: 1rem 0; border-left: 3px solid var(--line-strong); }
  .entry.question { border-left-color: var(--amber); }
  .entry.answer { border-left-color: var(--green); }
  .entry .head { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; font-size: .9rem; margin-bottom: .2rem; }
  .entry .kind { font-weight: 650; }
  .entry.question .kind { color: var(--amber); }
  .entry.answer .kind { color: var(--green); }
  .entry .who { font-family: var(--mono); font-size: .85rem; }
  .entry .when { color: var(--muted); }
  .entry .text > :first-child { margin-top: 0; }
  .entry .text > :last-child { margin-bottom: 0; }
  .entry .text pre { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .6rem .8rem; overflow: auto; font-size: .85rem; }

  h3 { font-size: .95rem; font-weight: 600; margin: 1.4rem 0 .4rem; }
  h3 + .lede { margin-top: -.2rem; }

  /* Running now: one block per agent. */
  .agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr)); gap: .75rem; }
  .agent { border: 1px solid var(--line); border-radius: 6px; padding: .6rem .8rem; background: var(--surface); }
  .agent.stale { border-color: var(--amber); }
  .agent .who { display: flex; flex-wrap: wrap; gap: .4rem .8rem; align-items: baseline; }
  .agent .handle { font-family: var(--mono); font-size: .9rem; font-weight: 600; }
  .agent .seen { color: var(--muted); font-size: .85rem; }
  .agent .flag { color: var(--amber); font-weight: 650; }
  .agent .holds { list-style: none; margin: .4rem 0 0; padding: 0; }
  .agent .holds li { padding: .15rem 0; }
  .agent .status { margin: .5rem 0 0; padding-top: .45rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }

  /* Up next: the queues, with the reason a task is held back. */
  .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); gap: .5rem 2rem; }
  .queue .repo { font-weight: 600; margin: .3rem 0 .2rem; }
  .queue ol { list-style: none; margin: 0; padding: 0; }
  .queue li { padding: .2rem 0; display: grid; grid-template-columns: auto 1fr; gap: .5rem; align-items: baseline; }
  .queue .pick { min-width: 0; }
  .queue li.held a { color: var(--muted); }
  .queue li.next .tag { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .queue .reason { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .queue .reason::before { content: "· "; }

  /* Activity: one line per event. */
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: grid; grid-template-columns: 6.5rem 1fr; gap: .8rem; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
  .feed li:last-child { border-bottom: 0; }
  .feed .when { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .feed .kind { font-weight: 600; }
  .feed li.question .kind { color: var(--amber); }
  .feed li.answer .kind { color: var(--green); }
  .feed li.merged .kind { color: var(--green); }
  .feed .who { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
  .feed .text { color: var(--muted); }
  .feed .text::before { content: "— "; }

  /* A commit in a task's history: one quiet line between the entries. */
  .event { padding: .1rem 0 .1rem 1rem; margin: .5rem 0; border-left: 3px solid transparent; font-size: .9rem; color: var(--muted); }
  .event .kind { font-weight: 600; color: var(--fg); }
  .event .who { font-family: var(--mono); font-size: .82rem; }

  @media (max-width: 40rem) {
    main { padding: 1rem .9rem 3rem; }
    .hero .number { font-size: 2.6rem; }
    th:nth-child(n+4), td:nth-child(n+4) { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">tv</a>
  {% block crumbs %}<span class="crumbs">control plane</span>{% endblock %}
  <form method="post" action="/refresh"><button type="submit" title="Fetch every repository now">Refresh</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
