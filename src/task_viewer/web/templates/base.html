<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tv{% endblock %} · tv</title>
<style>
  :root { --fg:#1f2328; --bg:#fff; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa;
          --warn:#9a6700; --warnbg:#fff8c5; --ok:#1a7f37; --link:#0969da; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --bg:#0d1117; --muted:#9198a1; --line:#3d444d; --card:#151b23;
            --warn:#d29922; --warnbg:#3a2e00; --ok:#3fb950; --link:#4493f8; --bad:#f85149; }
  }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; gap:1rem; align-items:center; padding:.6rem 1rem; border-bottom:1px solid var(--line); }
  header a { color:var(--fg); text-decoration:none; font-weight:600; }
  header form { margin-left:auto; }
  main { max-width:64rem; margin:0 auto; padding:1rem; }
  h1 { font-size:1.4rem; margin:.5rem 0 1rem; } h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; }
  a { color:var(--link); }
  .muted { color:var(--muted); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:.3rem .5rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:.85rem; }
  td.num { font-variant-numeric:tabular-nums; color:var(--muted); white-space:nowrap; }
  .rank { display:inline-block; min-width:1.4em; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:4px; font-size:.85rem; }
  .badge { display:inline-block; padding:0 .4em; border-radius:4px; font-size:.8rem; border:1px solid var(--line); background:var(--card); }
  .badge.question { color:var(--warn); background:var(--warnbg); border-color:var(--warn); }
  .badge.answer { color:var(--ok); border-color:var(--ok); }
  .entry { border:1px solid var(--line); border-radius:6px; margin:.6rem 0; }
  .entry .head { padding:.3rem .7rem; background:var(--card); border-bottom:1px solid var(--line); font-size:.9rem; }
  .entry .text { padding:.2rem .7rem; }
  .body { border:1px solid var(--line); border-radius:6px; padding:.2rem 1rem; }
  form.inline { display:inline; } button { font:inherit; padding:.25rem .7rem; cursor:pointer; }
  textarea { width:100%; min-height:6rem; font:inherit; box-sizing:border-box; }
  select { font:inherit; }
  pre { background:var(--card); padding:.6rem; overflow:auto; } code { background:var(--card); padding:0 .2em; }
  .ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <a href="/">tv · control plane</a>
  {% block crumbs %}{% endblock %}
  <form method="post" action="/refresh"><button type="submit" title="Fetch every repository now">Refresh</button></form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
